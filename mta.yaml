_schema-version: 3.3.0
ID: hmcl_Form22
description: A simple CAP project.
version: 1.0.0
modules:
  - name: hmcl_Form22-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: hmcl_Form22-destination-service
      - name: hmcl_Form22-connectivity
      - name: uaa_hmcl_Form22
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci
  - name: hmcl_Form22-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: hmcl_Form22-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - hmclform22ui.zip
          name: hmclform22ui
          target-path: resources/
  - name: hmclform22ui
    type: html5
    path: app/form22ui
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
  - name: hmcl_Form22-destination-content
    type: com.sap.application.content
    requires:
      - name: srv-api
      - name: hmcl_Form22-destination-service
        parameters:
          content-target: true
      - name: hmcl_Form22-repo-host
        parameters:
          service-key:
            name: hmcl_Form22-repo-host-key
      - name: uaa_hmcl_Form22
        parameters:
          service-key:
            name: uaa_hmcl_Form22-key
    parameters:
      content:
        instance:
          destinations:
            - Name: hmcl_Form22-srv-api
              URL: ~{srv-api/srv-url}
              Authentication: NoAuthentication
              HTML5.ForwardAuthToken: true
              HTML5.DynamicDestination: true
              ProxyType: Internet
              Type: HTTP
              sap.cloud.service: HMCL_Form22
            - Name: HMCL_Form22_hmcl_Form22_repo_host
              ServiceInstanceName: hmcl_Form22-html5-service
              ServiceKeyName: hmcl_Form22-repo-host-key
              sap.cloud.service: HMCL_Form22
            - Authentication: OAuth2UserTokenExchange
              Name: HMCL_Form22_uaa_hmcl_Form22
              ProxyType: Internet
              Type: HTTP
              URL: ~{uaa_hmcl_Form22/oauth2/token}
              ServiceInstanceName: hmcl_Form22-xsuaa-service
              ServiceKeyName: uaa_hmcl_Form22-key
              sap.cloud.service: HMCL_Form22
          existing_destinations_policy: update
    build-parameters:
      no-source: true
resources:
  - name: hmcl_Form22-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: hmcl_Form22-html5-service
      service-plan: app-host
  - name: hmcl_Form22-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
            existing_destinations_policy: update
        version: 1.0.0
      service: destination
      service-name: hmcl_Form22-destination-service
      service-plan: lite
  - name: hmcl_Form22-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
  - name: uaa_hmcl_Form22
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        oauth2-configuration:
          credential-types:
            - binding-secret
            - x509
        tenant-mode: dedicated
      path: ./xs-security.json
      service: xsuaa
      service-name: hmcl_Form22-xsuaa-service
      service-plan: application
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
